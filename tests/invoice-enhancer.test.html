<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER Invoice Scanner V3 — Offline Image Test</title>
<style>body{font:15px/1.5 Arial,sans-serif;max-width:800px;margin:2rem auto;padding:1rem;color:#24476c}li{margin:6px 0}.pass{color:#16733a}.fail{color:#ba3030}</style>
<script src="../invoice-photo-enhancer-v1.js"></script></head><body>
<h1>Invoice Scanner V3 — Local Test</h1>
<p>Uses synthetic graphics only. No uploads, accounts, OCR, AI or external requests.</p>
<ol id="results"></ol>
<script>
(async()=>{
const el=document.getElementById('results'),api=window.BBInvoiceEnhancerV1;
function check(label,test){const li=document.createElement('li');try{if(!test())throw Error('Assertion failed');li.className='pass';li.textContent='PASS · '+label;}
catch(e){li.className='fail';li.textContent='FAIL · '+label+' · '+e.message;document.title='FAILED — '+document.title;}el.append(li);}
const w=160,h=192,source=new Uint8ClampedArray(w*h*4);
for(let y=0;y<h;y++)for(let x=0;x<w;x++){
 const i=(y*w+x)*4,shadow=x<80?31:0;
 const ink=(x>28&&x<40&&y>24&&y<170);
 const c=ink?76-shadow/4:205-shadow;
 source[i]=source[i+1]=source[i+2]=c;source[i+3]=255;
}
const before=source.slice(),color=api.enhancePixels(source,w,h,'color'),bw=api.enhancePixels(source,w,h,'bw');
const natural=api.enhancePixels(source,w,h,'color','natural');
const clear=api.enhancePixels(source,w,h,'color','clear');
const strong=api.enhancePixels(source,w,h,'color','strong');
const naturalBw=api.enhancePixels(source,w,h,'bw','natural');
const strongBw=api.enhancePixels(source,w,h,'bw','strong');
const docNatural=api.enhancePixels(source,w,h,'scan','natural');
const docClear=api.enhancePixels(source,w,h,'scan','clear');
const docStrong=api.enhancePixels(source,w,h,'scan','strong');
const val=(a,x,y)=>a[(y*w+x)*4];
check('Original pixel data remains unmodified',()=>source.every((v,i)=>v===before[i]));
check('Clear remains the default for backwards-compatible calls',
 ()=>color.every((v,i)=>v===clear[i]));
check('Three supported enhancement presets exist in order',
 ()=>JSON.stringify(api.levels)===JSON.stringify(['natural','clear','strong']));
check('Handwriting/background contrast increases',
 ()=>val(color,70,20)-val(color,33,100)>val(source,70,20)-val(source,33,100));
check('Contrast increases Natural < Clear < Strong',()=>{
 const k=a=>val(a,70,20)-val(a,33,100);
 return k(natural)<k(clear)&&k(clear)<k(strong);
});
check('B&W has separate increasing strength profiles',()=>{
 const k=a=>val(a,70,20)-val(a,33,100);
 return k(naturalBw)<k(bw)&&k(bw)<k(strongBw);
});
check('Document Clean lifts uneven paper without bleaching it pure white',()=>{
 const paper=x=>val(docClear,x,20);
 return paper(20)>val(source,20,20)&&paper(145)>val(source,145,20)
   &&paper(20)<245&&paper(145)<245
   &&Math.abs(paper(20)-paper(145))<=Math.abs(val(source,20,20)-val(source,145,20));
});
check('Document Clean increases photographed-ink contrast with strength',()=>{
 const k=a=>val(a,145,20)-val(a,33,100);
 return k(docNatural)<k(docClear)&&k(docClear)<k(docStrong);
});
check('Document Clean preserves original alpha across every pixel',()=>docClear.every((v,i)=>
 i%4===3? v===source[i] : true));
check('Document Clean leaves original pixels unchanged',()=>source.every((v,i)=>v===before[i]));
check('Strength processing leaves all original pixels unchanged',
 ()=>source.every((v,i)=>v===before[i]));
check('A shadowed paper area becomes more even',
 ()=>Math.abs(val(color,15,20)-val(color,145,20))<=Math.abs(val(source,15,20)-val(source,145,20)));
check('B&W uses matched channels and retains alpha',
 ()=>bw.every((v,i)=>i%4===3? v===255 : v===bw[i-i%4]));
const colors=new Uint8ClampedArray([20,60,180,255,180,30,12,130]);
const values=api.enhancePixels(colors,2,1,'color');
check('Blue ink and red stamp hues stay distinguishable',
 ()=>values[2]>values[0]&&values[4]>values[5]&&values[7]===130);
const toneW=96,toneH=92,paper=new Uint8ClampedArray(toneW*toneH*4);
for(let y=0;y<toneH;y++)for(let x=0;x<toneW;x++){
 const i=(y*toneW+x)*4,shade=x<40?.78:1;
 const blue=x>18&&x<27&&y>15&&y<78;
 const red=x>52&&x<60&&y>15&&y<78;
 const faint=x>77&&x<83&&y>15&&y<78;
 const rgb=blue?[52,90,175]:red?[170,75,80]:
   faint?[208,203,201]:[224,216,204];
 paper[i]=Math.round(rgb[0]*shade);paper[i+1]=Math.round(rgb[1]*shade);
 paper[i+2]=Math.round(rgb[2]*shade);paper[i+3]=255;
}
const scanColor=api.enhancePixels(paper,toneW,toneH,'scan','clear');
const at=(a,x,y)=>{
 const i=(y*toneW+x)*4;
 return [a[i],a[i+1],a[i+2]];
};
check('Document Clean keeps blue pen blue and red stamp red',()=>{
 const blue=at(scanColor,22,42),red=at(scanColor,56,42);
 return blue[2]>blue[0]+25&&red[0]>red[1]+35;
});
check('Document Clean preserves warm paper rather than gray or pure white',()=>{
 const rgb=at(scanColor,90,8);
 return rgb[0]>rgb[1]&&rgb[1]>rgb[2]&&rgb[0]<248;
});
check('Faint pencil remains distinct from surrounding paper',()=>{
 const faint=at(scanColor,80,40),background=at(scanColor,90,40);
 return background[1]-faint[1]>=8;
});
check('Paper shadow remains gently graded, not unnaturally bleached',()=>{
 const left=at(scanColor,6,8),right=at(scanColor,90,8);
 return right[1]>left[1]&&left[1]>125;
});
check('Unsupported mode is rejected',()=>{
 try{api.enhancePixels(source,w,h,'invalid')}catch{return true}return false;
});
check('Unknown enhancement preset is rejected',()=>{
 try{api.enhancePixels(source,w,h,'color','unsupported')}catch{return true}
 return false;
});
const sample=document.createElement('canvas');sample.width=160;sample.height=220;
const ctx=sample.getContext('2d');
ctx.fillStyle='#deddd4';ctx.fillRect(0,0,160,220);
ctx.fillStyle='#234d9f';ctx.font='bold 20px sans-serif';ctx.fillText('INV-00001',8,38);
try{
 const original=await new Promise(r=>sample.toBlob(r,'image/png'));
 const enhanced=await api.enhance(original,'color');
 const strongPreview=await api.enhance(original,'color','strong');
 const cleanPreview=await api.enhance(original,'scan','clear');
 check('Browser Canvas produces an enhanced JPEG preview',
  ()=>enhanced.blob.type==='image/jpeg'&&enhanced.width===160&&enhanced.height===220);
 check('Canvas honors Clear as default and accepts Strong explicitly',
  ()=>enhanced.strength==='clear'&&strongPreview.strength==='strong'
     &&strongPreview.blob.size>0);
 check('Browser Canvas supports natural-colored Document Clean',
  ()=>cleanPreview.blob.type==='image/jpeg'&&cleanPreview.mode==='scan'&&cleanPreview.strength==='clear');
 check('Original Blob remains a PNG, never modified',
  ()=>original.type==='image/png'&&original.size>0);
}catch(e){check('Browser Canvas enhancement could run',()=>{throw e})}
})();
</script></body></html>
