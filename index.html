<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIG BROTHER — Real Invoice Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#1a3b63;font:14px Arial,sans-serif}.app{max-width:1220px;margin:auto;padding:16px}
header,.actions,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:22px;margin:0 0 5px}small{color:#70849a}.top{margin-bottom:16px}
button,input{font:inherit}button{background:#1769af;color:white;border:0;padding:10px 14px;border-radius:9px;font-weight:bold;cursor:pointer}button.alt{background:#e4effb;color:#185b96}button[disabled]{opacity:.45}button.active{background:#103f72}
input[type=search]{width:100%;padding:12px;border:1px solid #cad9e9;border-radius:11px;background:white;margin:10px 0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.card{background:white;padding:14px;border:1px solid #dae6f3;border-radius:13px;margin-bottom:10px}.row>div:first-child{min-width:0;flex:1}.row strong{font-size:16px}.meta{margin:7px 0;color:#657a91;font-size:12px;line-height:1.6}
.tag{display:inline-block;background:#fff1dd;color:#9e610b;border-radius:6px;padding:3px 6px;font-size:11px}.success{background:#e5f6ed;color:#17683f}
.message{min-height:20px;color:#a43836;margin:8px 0}.modal{position:fixed;inset:0;background:#102945ad;display:grid;place-items:center;padding:10px;z-index:5}.modal[hidden]{display:none}.sheet{width:min(520px,100%);max-height:94dvh;overflow:auto;border-radius:15px;background:white;padding:18px}
.sheet h2{margin:0;font-size:18px}.sheet label{display:block;margin:12px 0 6px;font-weight:bold}.sheet input[type=file]{width:100%;border:1px dashed #acbed3;padding:13px;border-radius:10px}.sheet img{max-width:100%;max-height:240px;object-fit:contain;border-radius:8px}.hint{font-size:12px;color:#69819a}.sheet .buttons{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:560px){.app{padding:10px}h1{font-size:19px}.row{align-items:flex-start}.row button{width:100%}.tabs button{flex:1} .sheet{padding:14px}}
</style></head><body><div class="app">
<header class="top"><div><h1>📷 Real Invoice Scanner</h1><small>BIG BROTHER · Original paper invoices</small></div><button id="refresh" class="alt">↻ Refresh</button></header>
<div class="tabs"><button id="pendingTab" class="active">Pending Scan</button><button id="uploadedTab" class="alt">Uploaded History</button></div>
<input id="search" type="search" placeholder="Search customer, invoice number, location">
<p class="message" id="message" role="status"></p><div id="items">Loading…</div>
</div>
<div class="modal" id="modal" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="row"><h2 id="modalTitle">Upload invoice</h2><button class="alt" id="close">✕</button></div>
<div id="target" class="meta"></div><label for="file">Choose a photo or PDF</label>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp,application/pdf" capture="environment">
<p class="hint">On desktop, paste a copied screenshot with Ctrl+V. Up to 12 MB. Only upload the paper invoice for this exact invoice/customer.</p>
<div id="preview" class="hint">No file selected</div><div class="buttons"><button id="cancel" class="alt">Cancel</button><button id="save" disabled>Upload Original</button></div>
<p class="message" id="uploadMessage"></p></section></div>
<script>
(()=>{
'use strict';
const URL='https://sjfhlaclgmkwwofzstok.supabase.co', KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION='BB_SUPABASE_DEV_SESSION_V1',BUCKET='bb-real-invoices';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='pending',rows=[],selected=null,chosen=null,busy=false,previewUrl='';
const clean=v=>String(v??'').trim();
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION)||'null')}catch{return null}}
async function token(){let s=readSession();if(!s?.access_token)throw Error('Please sign in through the BIG BROTHER Dashboard.');if(s.expires_at&&s.expires_at<Math.floor(Date.now()/1000)+45){let r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const v=await r.json();if(!r.ok)throw Error(v.msg||v.message||'Session expired');v.expires_at=Math.floor(Date.now()/1000)+v.expires_in;localStorage.setItem(SESSION,JSON.stringify(v));s=v}return s.access_token}
async function request(path,opts={}){const t=await token();const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+t,...opts.headers},cache:'no-store'});if(!r.ok){let msg=await r.text();try{const v=JSON.parse(msg);msg=v.message||v.error||msg}catch{}throw Error(msg)}if(r.status===204)return null;return r.json()}
async function rpc(name,obj){return request('/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj||{})})}
function notice(msg){$('message').textContent=msg||''}
function chooseMode(v){mode=v;for(const tab of ['pending','uploaded']){$(tab+'Tab').className=mode===tab?'active':'alt'}void load()}
function render(){const search=clean($('search').value).toLowerCase();const filtered=rows.filter(r=>[r.customer,r.invoiceNo,r.location,r.invoiceId].some(v=>clean(v).toLowerCase().includes(search)));$('items').innerHTML=filtered.length?filtered.map(r=>
'<article class="card row"><div><strong>'+esc(r.customer||'Unknown customer')+'</strong> <span class="tag '+(mode==='uploaded'?'success':'')+'">'+(mode==='pending'?'Needs scan':'Uploaded')+'</span><div class="meta">Invoice: '+esc(r.invoiceNo)+' · '+esc(r.invoiceDate)+'<br>Location: '+esc(r.location)+' · Outstanding: $'+Number(r.outstanding||0).toFixed(2)+(r.uploadedAt?'<br>Uploaded: '+esc(new Date(r.uploadedAt).toLocaleString()):'')+'</div></div><button data-id="'+esc(r.invoiceId)+'">'+(mode==='pending'?'📷 Upload':'👁 View')+'</button></article>').join(''):'<div class="card">No matching '+(mode==='pending'?'invoices needing a scan':'uploaded originals')+'.</div>';
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.invoiceId===b.dataset.id);if(r)mode==='pending'?openUpload(r):void view(r)});
}
async function load(){if(busy)return;notice('');$('items').textContent='Loading invoices…';try{rows=await rpc('bb_real_invoice_list',{p_mode:mode});if(!Array.isArray(rows))rows=[];render()}catch(e){$('items').textContent='';notice(e.message)}}
function setFile(f){if(previewUrl)URL.revokeObjectURL(previewUrl);chosen=null;$('save').disabled=true;if(!f){$('preview').textContent='No file selected';return}if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(f.type)){ $('uploadMessage').textContent='Only JPG, PNG, WebP or PDF.';return}if(f.size>12*1024*1024){$('uploadMessage').textContent='Max size is 12 MB.';return}chosen=f;previewUrl=window.URL.createObjectURL(f);$('preview').innerHTML=f.type.startsWith('image/')?'<img alt="Selected invoice preview" src="'+esc(previewUrl)+'">':'PDF: '+esc(f.name);$('save').disabled=false;$('uploadMessage').textContent=''}
function openUpload(r){selected=r;$('modalTitle').textContent='Upload Original Invoice';$('target').textContent=r.customer+' · '+r.invoiceNo+' · '+r.invoiceDate;$('modal').hidden=false;setFile(null);$('file').value='';$('uploadMessage').textContent=''}
function close(){if(busy)return;$('modal').hidden=true;selected=null;chosen=null;if(previewUrl){window.URL.revokeObjectURL(previewUrl);previewUrl=''}}
async function upload(){if(!selected||!chosen||busy)return;busy=true;$('save').disabled=true;$('uploadMessage').textContent='Uploading securely…';
const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'}[chosen.type],path=selected.invoiceId+'/'+crypto.randomUUID()+'.'+ext;
try{const t=await token();const r=await fetch(URL+'/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(path).replace('%2F','/'),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':chosen.type,'x-upsert':'false'},body:chosen});if(!r.ok){const v=await r.json().catch(()=>({}));throw Error(v.message||v.error||'Storage upload failed')}
try{await rpc('bb_real_invoice_register',{p_invoice_id:selected.invoiceId,p_storage_path:path,p_mime:chosen.type,p_source:'pending_scan'})}catch(e){await request('/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(path).replace('%2F','/'),{method:'DELETE'}).catch(()=>{});throw e}
busy=false;close();await load();notice('Invoice original securely uploaded. Removed from Pending Scan.');
}catch(e){$('uploadMessage').textContent=e.message}finally{busy=false;$('save').disabled=!chosen}}
async function view(r){try{const t=await token();const response=await fetch(URL+'/storage/v1/object/sign/'+BUCKET+'/'+encodeURIComponent(r.path).replace('%2F','/'),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:120})});let data=await response.json();if(!response.ok)throw Error(data.message||'Cannot open private original');const path=data.signedURL;window.open(path.startsWith('http')?path:URL+'/storage/v1'+path,'_blank','noopener,noreferrer')}catch(e){notice(e.message)}}
$('pendingTab').onclick=()=>chooseMode('pending');$('uploadedTab').onclick=()=>chooseMode('uploaded');$('refresh').onclick=load;$('search').oninput=render;$('close').onclick=close;$('cancel').onclick=close;$('file').onchange=e=>setFile(e.target.files?.[0]);$('save').onclick=upload;
document.addEventListener('paste',e=>{if($('modal').hidden)return;const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(f){e.preventDefault();setFile(f)}});void load();
})();
</script></body></html>
